name: PR Validation

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write

jobs:
  validate:
    uses: sweetrpg/github-actions/.github/workflows/go-ci.yaml@master
    with:
      publish-coverage: false
      # GOFLAGS=-v lists each test in the log, so a package that ran nothing is visible.
      test-env: '{"GOFLAGS": "-v"}'
    secrets: inherit
