apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-game-systems

resources:
    - ../../base
    - configmaps.yaml
    - secrets.yaml
    - ingress.yaml
    - middlewares.yaml

labels:
    - pairs:
          app.kubernetes.io/name: game-systems-api
          app.kubernetes.io/version: v1
          app.kubernetes.io/component: api
          app.kubernetes.io/part-of: game-systems
          com.sweetrpg/env: local
      includeSelectors: false
      includeTemplates: true

generatorOptions:
    disableNameSuffixHash: true

images:
    - name: game-systems-api
      newName: ghcr.io/sweetrpg/game-systems-api
      newTag: latest
