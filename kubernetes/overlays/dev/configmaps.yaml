---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: dev
  # mongodb.go builds the connection string from these DB_* parts rather than one opaque
  # DB_URI - only the password (DB_PW, in secrets/db.yaml) is sensitive. DB_HOST is Atlas's own
  # SRV hostname for Cluster0 - not secret, but not derivable from anything else in this repo.
  DB_SCHEME: mongodb+srv
  DB_HOST: cluster0.z9nxg.mongodb.net
  DB_USER: game-systems-api
  DB_NAME: sweetrpg-game-systems
  DB_OPTS: retryWrites=true&w=majority
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318/
  AUTH_API_URL: http://api-v1.sweetrpg-auth.svc.cluster.local:8000
  # USERS_API_URL resolves a verified subject to its canonical users._id for the audit fields
  # (created_by/updated_by). Internal call, pinned to api-v1 per docs/deployment-conventions.md.
  USERS_API_URL: http://api-v1.sweetrpg-users.svc.cluster.local:8000
  # Game-system change-event publishing. Fails open: if NATS is unreachable the mutation still
  # succeeds. NATS_USER/NATS_PASSWORD come from the api-nats secret (externalsecret-nats.yaml).
  NATS_URL: nats://nats.nats-system.svc.cluster.local:4222
  PUBLISH_TIMEOUT_MS: "3000"
