---
# api-nats: NATS_USER / NATS_PASSWORD for the game-system change-event publisher, from the
# `gamesystems` static account provisioned in pilgrimagesoftware/flux. Publishing is fail-open,
# so a missing or stale value degrades to "events dropped", never a failed mutation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: game-systems-api-nats

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-nats
    creationPolicy: Owner
  data:
    - secretKey: NATS_USER
      remoteRef:
        key: /sweetrpg/game-systems/api/nats/auth
        property: username
    - secretKey: NATS_PASSWORD
      remoteRef:
        key: /sweetrpg/game-systems/api/nats/auth
        property: password
