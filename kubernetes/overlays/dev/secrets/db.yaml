---
# api-db: the DB_PW the app itself connects with, rewritten from the same Akeyless value the
# AtlasDatabaseUser's own ExternalSecret (../atlas-db-user.yaml) reads - see that file's comment
# for why the same value backs both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: api-db

spec:
  refreshInterval: 12h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /sweetrpg/game-systems/api/db
      rewrite:
        - regexp:
            source: "DB_PASSWORD"
            target: "DB_PW"
